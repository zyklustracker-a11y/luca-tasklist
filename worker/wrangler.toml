# Cloudflare-Worker für den täglichen Morgen-Push (alle Nutzer, alle Geräte).
# Deploy-Anleitung Schritt für Schritt: siehe worker/README.md
#
# Der Name des Workers ist reine Infrastruktur (er steckt in der Adresse
# https://<name>.<konto>.workers.dev) und wird deshalb nicht umbenannt –
# eine Änderung würde die WORKER_URL in index.html ungültig machen.
name = "luca-tasklist-push"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "b0af5adf3e408abb8566f16eb1451f2f"

# Öffentlicher VAPID-Schlüssel – identisch zu VAPID_PUBLIC_KEY in index.html.
# Nicht geheim, darf im Repository stehen. Der PRIVATE Schlüssel wird NICHT
# hier eingetragen, sondern als Secret gesetzt:
#   wrangler secret put VAPID_PRIVATE_KEY
[vars]
VAPID_PUBLIC_KEY = "BLoqjHdIwfSrLH4JxSWWjxvudOsqhGMNA8RsKFUysL6FlS3ZWjDWoSyw7hRTy1cdteL652gWuBKLqi57eyImkC8"
# Absender-Kennung für den VAPID-Nachweis (RFC 8292): mailto: oder https:.
# Push-Dienste verlangen sie, um bei Problemen jemanden erreichen zu können.
VAPID_SUBJECT = "mailto:luca.toriellolt@gmail.com"

# Firebase-Projekt, dessen Anmeldungen der Worker akzeptiert. Muss exakt der
# projectId aus firebaseConfig in index.html entsprechen – daran erkennt der
# Worker, dass ein ID-Token wirklich zu DIESER App gehört.
FIREBASE_PROJECT_ID = "luca-tasklist"
# Optional strenger: nur Anfragen von deiner GitHub-Pages-Adresse zulassen.
# Ohne diese Zeile sind Anfragen von überall erlaubt (für eine private App ok).
# ALLOWED_ORIGIN = "https://DEINNAME.github.io"

# Speicher für Abos + Einstellungen. Verweist auf den bestehenden
# KV-Namespace – kein neuer nötig.
[[kv_namespaces]]
binding = "SUBS"
id = "dfbab15d410c46978b67765115a509fc"

# Cron: alle 15 Minuten prüfen, für wen es Zeit ist. Die eigentliche Uhrzeit
# steuerst du in der App; der Worker gleicht sie gegen deine Zeitzone ab.
[triggers]
crons = ["*/15 * * * *"]
