name: Tägliche Erinnerung

# Der Zeitplan läuft stündlich (in UTC). Das Skript sendet nur bei dem Lauf,
# bei dem es in Europe/Zurich gerade die gewünschte Stunde ist – so lässt sich
# die Uhrzeit frei über die Repository-Variable REMINDER_HOUR wählen, und die
# Zeitumstellung wird automatisch berücksichtigt.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort senden, unabhängig von der Uhrzeit'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Anstoss senden
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          REMINDER_HOUR: ${{ vars.REMINDER_HOUR }}
          FORCE: ${{ inputs.force }}
        run: node scripts/send-reminder.mjs
